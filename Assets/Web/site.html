<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>`title`</title>
<style>`css`</style>
</head>
<body class="`bodyClass`">
<header id="hdr">
  <button id="navToggle" type="button" aria-label="Guides and tutorials" aria-controls="side" aria-expanded="false">&#9776;</button>
  <a class="brand" id="homelink" href="#">`brand``subtitle`</a>
  <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="go"
    placeholder="Filter guides, tutorials and symbols  (/)"
    title="Type to filter; Enter opens the best match; Esc clears"
    aria-label="Filter the navigation; Enter opens the best match" />
  <button id="symToggle" type="button" aria-label="Symbols" aria-controls="side-right" aria-expanded="false">&#8942;</button>
  <a class="home" id="resourcelink" href="`resource`" target="_blank" rel="noopener">`resourceLabel`
    <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" /></svg>
  </a>
</header>
<div id="main">
  <div id="scrim"></div>
  <nav id="side-right" class="`railClass`" data-batch-size="`batchSize`" aria-label="Symbols">
    <script>
      // Remember input while the rest of the catalog is still on the wire.
      (function (rail) {
        if (!rail.classList.contains('indexed')) return;
        function choose(value) { rail.dataset.pendingLetter = value; delete rail.dataset.extraBatches; }
        rail.onclick = function (event) {
          if (event.target.matches('.symbol-letters button')) choose(event.target.value);
          if (event.target.matches('.symbol-more')) rail.dataset.extraBatches = Number(rail.dataset.extraBatches || 0) + 1;
        };
        rail.onchange = function (event) { if (event.target.id === 'symbol-first-letter') choose(event.target.value); };
      })(document.currentScript.parentNode);
    </script>
    <div class="symbol-index" `indexHidden`>
      <div class="symbol-heading"><h2>Symbol index</h2><span class="symbol-total">`symbolTotal`</span></div>
      <div class="symbol-browse">
        <div class="symbol-letters" role="group" aria-label="First letter">`letterButtons`</div>
        <div class="symbol-letter-picker">
          <label for="symbol-first-letter">First letter</label>
          <div class="symbol-select"><select id="symbol-first-letter">`letterOptions`</select></div>
        </div>
        <div class="symbol-prefix" `prefixHidden`>
          <label for="symbol-prefix">Symbol group</label>
          <div class="symbol-select">
            <select id="symbol-prefix">`initialOption`</select>
            <span class="symbol-selection" aria-hidden="true">`initialGroup`</span>
          </div>
        </div>
      </div>
      <div class="symbol-count" role="status">`symbolCount`</div>
      <noscript><a href="`resource`">Open the documentation</a></noscript>
    </div>
    <div class="symbol-scroll">`symbols`<button class="symbol-more" type="button" `moreHidden`>`moreText`</button></div>
  </nav>
  <nav id="side" aria-label="Guides and tutorials">`sidebar`</nav>
  <div class="splitter" id="splitL" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the guides rail"></div>
  <div id="content">
    <div id="loading">Loading...</div>
    <iframe id="frame" title="documentation"></iframe>
  </div>
  <div class="splitter" id="splitR" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the symbols rail"></div>
</div>
`footer`
`remainingSymbols`
<script type="application/json" id="pp-config">`config`</script>
<script>`js`</script>
</body>
</html>
