<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>`title`</title>
<link rel="stylesheet" href="https://www.wolframcdn.com/fonts/source-sans-pro/1.0/global.css" />
<style>`css`</style>
</head>
<body class="`bodyClass`">
<header id="hdr">
  <button id="navToggle" type="button" aria-label="Guides and tutorials" aria-controls="side" aria-expanded="false">&#9776;</button>
  <a class="brand" id="homelink" href="#">`brand``subtitle`</a>
  <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="go"
    placeholder="Filter guides, tutorials and symbols  (/)"
    title="Type to filter; Enter opens the best match; Esc clears"
    aria-label="Filter the navigation; Enter opens the best match" />
  <button id="symToggle" type="button" aria-label="Symbols" aria-controls="side-right" aria-expanded="false">&#8942;</button>
  <a class="home" id="resourcelink" href="`resource`" target="_blank" rel="noopener">`resourceLabel`
    <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" /></svg>
  </a>
</header>
<div id="main">
  <div id="scrim"></div>
  <nav id="side" aria-label="Guides and tutorials">`sidebar`</nav>
  <div class="splitter" id="splitL" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the guides rail"></div>
  <div id="content">
    <div id="loading">Loading...</div>
    <iframe id="frame" title="documentation"></iframe>
  </div>
  <div class="splitter" id="splitR" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the symbols rail"></div>
  <nav id="side-right" aria-label="Symbols">
    <div class="symbol-index" hidden>
      <div class="symbol-heading"><h2>Symbol index</h2><span class="symbol-total"></span></div>
      <div class="symbol-browse">
        <div class="symbol-letters" role="group" aria-label="First letter"></div>
        <div class="symbol-letter-picker">
          <label for="symbol-first-letter">First letter</label>
          <div class="symbol-select"><select id="symbol-first-letter"></select></div>
        </div>
        <div class="symbol-prefix" hidden>
          <label for="symbol-prefix">Symbol group</label>
          <div class="symbol-select">
            <select id="symbol-prefix"></select>
            <span class="symbol-selection" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="symbol-count" role="status"></div>
    </div>
    <div class="symbol-scroll">`symbols`<button class="symbol-more" type="button" hidden></button></div>
  </nav>
</div>
`footer`
<script type="application/json" id="pp-config">`config`</script>
<script>`js`</script>
</body>
</html>
